<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>拼图闯关</title>
<style>
  :root{
    --bg:#f6f2ec; --panel:#ffffff; --ink:#34322e; --muted:#8b877d;
    --line:rgba(0,0,0,.08); --accent:#ef7d4f; --accent-d:#e76a3a;
    --accent2:#27b08a; --gold:#f0b24a; --seam:#e9e3d8;
    --shadow:0 6px 18px rgba(120,90,60,.12);
    --shadow-sm:0 3px 10px rgba(120,90,60,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%; overscroll-behavior-x:none}
  /* 禁止横向 overscroll 触发浏览器前进/后退手势（Chrome/安卓有效） */
  html,body{overscroll-behavior:none; overscroll-behavior-x:none}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(125% 90% at 50% 0%, #fbf7f1 0%, #efe8dd 100%);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh; overscroll-behavior:none;
    /* 禁止长按选中文字 / 呼出菜单（iOS Safari 需 -webkit- 前缀），避免长按干扰拖拽 */
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  .app{
    width:100%; max-width:480px; height:100dvh; margin:0 auto;
    display:flex; flex-direction:column; overflow:hidden;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  }
  .screen{flex:1 1 auto; display:none; flex-direction:column; min-height:0}
  .screen.active{display:flex}

  /* ---------- Home ---------- */
  #home{align-items:center; justify-content:center; gap:22px; text-align:center}
  .logo{
    font-size:30px; font-weight:800; letter-spacing:2px;
    background:linear-gradient(120deg,var(--accent-d),var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo small{display:block; font-size:13px; font-weight:500; color:var(--muted); letter-spacing:4px; margin-top:8px}
  .btn{
    border:none; border-radius:18px; padding:15px 26px; font-size:16px; font-weight:700; letter-spacing:.5px;
    background:linear-gradient(180deg,var(--accent),var(--accent-d)); color:#fff; cursor:pointer;
    transition:transform .08s ease, box-shadow .2s, filter .2s;
    box-shadow:0 8px 18px rgba(231,106,58,.30);
  }
  .btn:active{transform:translateY(1px) scale(.97); box-shadow:0 4px 10px rgba(231,106,58,.28)}
  .btn.ghost{background:var(--panel); color:var(--ink); box-shadow:var(--shadow-sm); border:1px solid var(--line); font-weight:600}
  .btn.ghost:active{transform:scale(.97); background:#faf7f2}
  .home-actions{display:flex; flex-direction:column; gap:12px; width:210px}

  /* ---------- Level select ---------- */
  #select{padding-top:8px}
  .topbar{display:flex; align-items:center; gap:10px; padding:8px 2px 14px; flex:0 0 auto}
  .topbar h2{font-size:17px; margin:0; font-weight:600; flex:1}
  .iconbtn{border:1px solid var(--line); background:var(--panel); border-radius:14px; width:42px; height:42px; font-size:18px; cursor:pointer; color:var(--ink); flex:0 0 auto; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); transition:transform .08s, background .2s, color .2s}
  .iconbtn:active{transform:scale(.94)}
  .iconbtn.muted{background:#efe9e0; color:var(--muted); box-shadow:none}
  .iconbtn svg{display:block}
  #btnSound .ico-off{display:none}
  #btnSound.muted .ico-on{display:none}
  #btnSound.muted .ico-off{display:inline}
  .levels{flex:1 1 auto; overflow-y:auto; display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:2px 2px 20px; align-content:start; min-height:0}
  .lvcell{
    aspect-ratio:1; border-radius:20px; border:1px solid var(--line); background:var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:20px; font-weight:800; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:var(--shadow-sm); transition:transform .1s ease, box-shadow .2s;
  }
  .lvcell:active{transform:scale(.95); box-shadow:var(--shadow)}
  .lvcell .num{font-size:22px; font-weight:800; color:var(--ink); line-height:1}
  .lvcell .grid{font-size:10px; color:var(--muted); font-weight:500}
  .lvcell.locked{opacity:.45; filter:grayscale(.3)}
  .lvcell.locked .num{color:var(--muted)}
  .lvcell.done{border-color:var(--accent2); background:linear-gradient(180deg,#fff,#f0fbf7)}
  .lvcell .stars{font-size:10px; color:var(--gold); letter-spacing:1px; height:12px}
  .lvcell .lock{position:absolute; top:6px; right:8px; font-size:13px; opacity:.5}

  /* ---------- Game ---------- */
  #game{padding-top:8px}
  .hud{display:flex; align-items:stretch; gap:8px; padding:4px 2px 10px; flex:0 0 auto}
  /* 芯片按内容定宽 + 给足最小宽度，不再等分挤压；“用时”额外加宽，完整显示 12:34 这类时间 */
  .hud .stat{flex:0 0 auto; min-width:72px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:7px 9px; display:flex; align-items:center; justify-content:center; gap:7px; box-shadow:var(--shadow-sm)}
  .hud .stat.time{min-width:90px}
  .hud .stat .s-ico{font-size:17px; line-height:1; flex:0 0 auto; filter:drop-shadow(0 1px 1px rgba(0,0,0,.06))}
  .hud .stat .s-body{display:flex; flex-direction:column; min-width:0; line-height:1.12; overflow:hidden}
  .hud .stat .s-body b{color:var(--ink); font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums}
  .hud .stat .s-body em{font-style:normal; color:var(--muted); font-size:10px; font-weight:500}
  .hud .spacer{flex:1 1 auto; min-width:6px}
  /* iPhone 14 等窄屏：适度收紧但保留芯片最小宽度，确保用时不被裁成省略号 */
  @media (max-width:400px){
    .hud{gap:5px}
    .hud .stat{min-width:56px; padding:6px 5px; gap:5px}
    .hud .stat.time{min-width:76px}
    .hud .stat .s-ico{font-size:14px}
    .hud .stat .s-body b{font-size:14px}
    .hud .stat .s-body em{font-size:9px}
    .hud .iconbtn{width:36px; height:36px; flex-basis:36px}
  }
  .boardwrap{flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden; padding:2px 0; position:relative}
  .board{
    position:relative; width:100%; max-width:100%; max-height:100%;
    display:grid; gap:0; background:var(--seam); border-radius:18px;
    border:3px solid #fff; box-shadow:0 12px 30px rgba(120,90,60,.20);
    touch-action:none; user-select:none; overflow:hidden;
  }
  .piece{
    position:relative; background:var(--seam); cursor:grab;
    touch-action:none; user-select:none;
  }
  .piece.lifting{z-index:30}
  .piece .face{
    position:absolute; left:0; top:0; right:0; bottom:0;
    background-repeat:no-repeat; border-radius:0;
    touch-action:none; user-select:none;
  }
  /* 缝：覆盖在碎片上层的“描边”遮罩，只遮挡图像边缘、不裁剪内容；
     合并（同组）时该侧不画遮罩 -> 两块严丝合缝、图像完整对齐 */
  .piece .seam{
    position:absolute; left:0; top:0; right:0; bottom:0;
    pointer-events:none; border-radius:0;
  }
  .piece.lifting{transform:scale(1.03)}
  .piece.lifting .face{box-shadow:0 10px 26px rgba(0,0,0,.32)}
  .piece.hint .face{outline:3px solid var(--accent2); outline-offset:-3px; z-index:5}

  .footer{display:flex; gap:8px; padding:10px 2px calc(12px + env(safe-area-inset-bottom)); flex:0 0 auto}
  .footer .btn{flex:1 1 0; min-width:0; padding:12px 0; font-size:14px; display:flex; align-items:center; justify-content:center; gap:6px; border-radius:16px}
  .footer .btn .e{font-size:17px; line-height:1}
  .footer .btn:active{transform:scale(.97)}

  /* peek overlay（看原图：全屏遮罩） */
  .overlay{position:fixed; inset:0; background:rgba(20,18,16,.82); display:none; align-items:center; justify-content:center; z-index:100; padding:24px}
  .overlay.active{display:flex}
  .peekimg{max-width:88%; max-height:80%; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.5)}

  /* 过关：底部 sheet + 透出完整拼图，可收起欣赏 */
  .winOverlay{position:fixed; inset:0; z-index:100; display:none; align-items:flex-end; justify-content:center; padding:0}
  .winOverlay.active{display:flex}
  .winScrim{position:absolute; inset:0; background:linear-gradient(to bottom, rgba(12,10,8,0) 36%, rgba(12,10,8,.5) 100%); -webkit-tap-highlight-color:transparent}
  .winNextFloat{position:absolute; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:none;
    border:none; border-radius:999px; padding:13px 30px; font-size:16px; font-weight:700; color:#fff;
    background:linear-gradient(120deg,var(--accent),var(--accent-d)); box-shadow:0 8px 24px rgba(216,90,48,.42); cursor:pointer}
  .winOverlay.collapsed .winNextFloat{display:block; animation:winPop .3s ease}
  .winSheet{position:relative; width:100%; max-width:440px; box-sizing:border-box; margin:0 auto;
    background:var(--panel); border-radius:26px 26px 0 0; padding:12px 22px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 44px rgba(40,25,10,.32); text-align:center;
    transform:translateY(0); transition:transform .34s cubic-bezier(.2,.85,.25,1)}
  .winOverlay.collapsed .winSheet{transform:translateY(112%)}
  .winCollapse{position:absolute; top:8px; left:50%; transform:translateX(-50%);
    min-width:132px; height:30px; border:1px solid rgba(0,0,0,.07); border-radius:999px;
    background:#f2ede3; color:#6b675f; font-size:12px; font-weight:700; letter-spacing:.5px;
    display:flex; align-items:center; justify-content:center; gap:5px; cursor:pointer;
    box-shadow:var(--shadow-sm)}
  .winCollapse:active{transform:translateX(-50%) scale(.95)}
  .winCollapse .chev{font-size:15px; line-height:1; margin-top:-2px}
  .winEmoji{font-size:30px; margin-top:32px; animation:winPop .42s ease}
  .winSheet h3{margin:2px 0 4px; font-size:25px; font-weight:800; background:linear-gradient(120deg,var(--accent-d),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent}
  .winSheet .bigstars{font-size:34px; color:var(--gold); letter-spacing:4px; margin:8px 0; text-shadow:0 2px 6px rgba(240,178,74,.35)}
  .winSheet p{color:var(--muted); font-size:14px; margin:4px 0 18px}
  .winMain{width:100%; padding:14px 0; font-size:16px; border-radius:16px}
  .winSub{display:flex; gap:10px; margin-top:10px}
  .winSub .btn{flex:1; padding:12px 0; font-size:14px; border-radius:16px}
  @keyframes winPop{0%{transform:scale(.6); opacity:0} 100%{transform:scale(1); opacity:1}}

  /* ---------- Juice：合并粒子 / 连击徽章 / 落位回弹 / 星级弹出 ---------- */
  .fxlayer{position:absolute; inset:0; pointer-events:none; z-index:60}
  .particle{position:absolute; width:7px; height:7px; border-radius:50%; pointer-events:none;
    animation:pfly .55s ease-out forwards}
  @keyframes pfly{to{transform:translate(var(--dx),var(--dy)) scale(.25); opacity:0}}
  .combo{position:absolute; z-index:61; font-size:19px; font-weight:800; color:var(--accent);
    pointer-events:none; text-shadow:0 2px 8px rgba(216,90,48,.4);
    animation:cpop .65s ease-out forwards}
  @keyframes cpop{0%{transform:translate(-50%,-50%) scale(.4); opacity:0}
    25%{transform:translate(-50%,-50%) scale(1.3); opacity:1}
    100%{transform:translate(-50%,-160%) scale(1); opacity:0}}
  .piece.snap{animation:snapz .14s ease-out}
  @keyframes snapz{0%{transform:scale(1.07)} 100%{transform:scale(1)}}
  .winSheet .bigstars span{display:inline-block; opacity:.22; transform:scale(.6)}
  .winSheet .bigstars span.on{opacity:1; transform:scale(1)}
  .winSheet .bigstars span.on.anim{animation:starpop .45s cubic-bezier(.2,1.5,.4,1) both; animation-delay:var(--d,0s)}
  @keyframes starpop{0%{transform:scale(.2) rotate(-40deg); opacity:0}
    100%{transform:scale(1) rotate(0); opacity:1}}

  /* ---------- 主题列表（首页） ---------- */
  .themelist{flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:6px 2px 10px; min-height:0}
  .tcard{background:var(--panel); border-radius:20px; overflow:hidden; box-shadow:var(--shadow);
    border:1px solid var(--line); cursor:pointer; transition:transform .1s ease;
    display:flex; flex-direction:column; flex:0 0 auto}
  .tcard:active{transform:scale(.98)}
  .tcard .cover{width:100%; height:clamp(72px,11vh,120px); object-fit:cover; display:block; background:var(--seam); flex:0 0 auto}
  .tcard .t-body{display:flex; align-items:center; gap:10px; padding:9px 14px 11px; flex:0 0 auto}
  .tcard .t-title{font-weight:800; font-size:16px}
  .tcard .t-sub{font-size:11px; color:var(--muted); margin-top:2px}
  .tcard .t-prog{margin-left:auto; text-align:right; font-size:12px; color:var(--muted); flex:0 0 auto}
  .tcard .t-prog b{color:var(--accent); font-size:16px}
  .tcard .t-bar{height:5px; background:var(--seam); border-radius:99px; overflow:hidden; margin-top:6px}
  .tcard .t-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),var(--accent)); border-radius:99px}
  .home-reset{text-align:center; padding:0 0 calc(14px + env(safe-area-inset-bottom)); font-size:12px}
  .home-reset button{border:none; background:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline}

  /* ---------- 章节地图 ---------- */
  .mapcol{flex:1 1 auto; overflow-y:auto; padding:26px 0 48px; min-height:0; position:relative}
  .mapcol::before{content:""; position:absolute; left:50%; top:0; bottom:0; width:0;
    border-left:3px dashed rgba(0,0,0,.10)}
  .mapnode{display:flex; align-items:center; justify-content:space-between; gap:12px; width:230px; margin:0 auto 20px; position:relative}
  .mapnode:nth-child(odd){transform:translateX(-34px)}
  .mapnode:nth-child(even){transform:translateX(34px)}
  .mcircle{width:54px; height:54px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:18px; border:3px solid #fff; box-shadow:var(--shadow); background:var(--panel); color:var(--ink);
    position:relative; z-index:1}
  .mapnode.done .mcircle{background:linear-gradient(135deg,#ffe9c2,#ffd88a); color:#8a5a00}
  .mapnode.cur .mcircle{background:linear-gradient(135deg,var(--accent),var(--accent-d)); color:#fff; animation:mpulse 1.6s ease-in-out infinite}
  .mapnode.locked{opacity:.55}
  .mapnode.locked .mcircle{color:var(--muted)}
  /* 圆钮与缩略图之间的虚线连接带（两端钻进两侧元素底下，像钉在一起） */
  .mlink{flex:1 1 auto; height:0; border-top:2px dashed rgba(232,165,60,.55); margin:0 -8px; z-index:0}
  /* 已通关页面的右侧缩略图（星级角标叠加在底部） */
  .mthumb{position:relative; z-index:1; width:62px; height:92px; border-radius:12px; overflow:hidden;
    flex:0 0 auto; border:2px solid #fff; box-shadow:var(--shadow); background:var(--seam);
    animation:thumbIn .32s ease}
  .mthumb img{width:100%; height:100%; object-fit:cover; display:block}
  .mthumb .mstars{position:absolute; left:0; right:0; bottom:0; padding:10px 0 3px; text-align:center;
    font-size:11px; color:var(--gold); letter-spacing:1px; line-height:1;
    background:linear-gradient(to top, rgba(20,15,10,.6), rgba(20,15,10,0)); text-shadow:0 1px 2px rgba(0,0,0,.55)}
  @keyframes thumbIn{0%{transform:scale(.75); opacity:0} 100%{transform:scale(1); opacity:1}}
  @keyframes mpulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.1)}}
  .chapter-read{margin:0 2px 8px}

  /* ---------- 过关剧情字幕 ---------- */
  .winSheet .winCaption{color:var(--ink); font-size:15px; line-height:1.6; margin:2px 0 14px;
    padding:10px 14px; background:#faf6ef; border-radius:14px; font-weight:600}

  /* ---------- 漫画阅读模式 ---------- */
  .reader{position:fixed; inset:0; background:#171310; z-index:120; display:none; flex-direction:column}
  .reader.active{display:flex}
  .readerTop{display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 14px 8px; color:#fff; flex:0 0 auto}
  .readerTop .rt-title{font-weight:700; font-size:15px}
  .readerTop .iconbtn{background:rgba(255,255,255,.12); border-color:transparent; color:#fff}
  .readerTrack{flex:1 1 auto; display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; min-height:0}
  .rpage{flex:0 0 100%; height:100%; scroll-snap-align:center; display:flex; align-items:center; justify-content:center; padding:8px}
  .rpage img{max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.5); object-fit:contain}
  .rlock{color:#8a857c; text-align:center; font-size:13px; line-height:1.9}
  .rlock .big{font-size:40px; display:block; margin-bottom:6px; opacity:.6}
  .readerCap{padding:10px 22px calc(14px + env(safe-area-inset-bottom)); color:#f5efe4; text-align:center; flex:0 0 auto}
  .readerCap .cap{font-size:15px; line-height:1.6; min-height:24px}
  .readerCap .num{opacity:.45; font-size:12px; margin-top:4px}
  .hidden-preload{position:absolute; width:0; height:0; overflow:hidden}
</style>
</head>
<body>
<div class="app">

  <!-- Home：主题（剧情）列表 -->
  <section id="home" class="screen active">
    <div class="topbar"><h2>拼图故事集</h2></div>
    <div class="themelist" id="themeList"></div>
    <div class="home-reset"><button id="btnReset">重置全部进度</button></div>
  </section>

  <!-- Chapter：章节地图（路径节点 = 每一页） -->
  <section id="chapter" class="screen">
    <div class="topbar">
      <button class="iconbtn" id="chapterBack">‹</button>
      <h2 id="chapterTitle">章节</h2>
      <div class="spacer"></div>
      <button class="btn chapter-read" id="btnReader">📖 阅读</button>
    </div>
    <div class="mapcol" id="mapCol"></div>
  </section>

  <!-- Game -->
  <section id="game" class="screen">
    <div class="hud">
      <button class="iconbtn" id="gameBack" title="返回">‹</button>
      <div class="stat"><span class="s-ico">🏁</span><span class="s-body"><b id="hudLevel">1</b><em>关卡</em></span></div>
      <div class="stat"><span class="s-ico">👣</span><span class="s-body"><b id="hudMoves">0</b><em>步数</em></span></div>
      <div class="stat time"><span class="s-ico">⏱️</span><span class="s-body"><b id="hudTime">0:00</b><em>用时</em></span></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="btnSound" title="音效：开" aria-label="音效开关">
        <svg class="ico-on" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/></svg>
      </button>
      <button class="iconbtn" id="btnFx" title="动效：开" aria-label="动效开关">✨</button>
    </div>
    <div class="boardwrap"><div class="board" id="board"></div><div class="fxlayer" id="fxLayer"></div></div>
    <div class="footer">
      <button class="btn ghost" id="btnPeek"><span class="e">👁️</span>看原图</button>
      <button class="btn ghost" id="btnHint"><span class="e">💡</span>提示</button>
      <button class="btn ghost" id="btnRestart"><span class="e">🔀</span>重排</button>
    </div>
  </section>

</div>

<div class="overlay" id="peekOverlay"><img class="peekimg" id="peekImg" alt="原图"></div>
<div class="winOverlay" id="winOverlay">
  <div class="winScrim" id="winScrim"></div>
  <button class="winNextFloat" id="winNextFloat">下一关 →</button>
  <div class="winSheet">
    <button class="winCollapse" id="winCollapse" aria-label="收起以欣赏图片"><span class="chev">︾</span>收起欣赏图片</button>
    <div class="winEmoji">🎉</div>
    <h3>过关啦！</h3>
    <div class="bigstars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="winCaption" id="winCaption"></div>
    <p id="winInfo"></p>
    <button class="btn winMain" id="winNext">下一关 →</button>
    <div class="winSub">

  var Sound = (function(){
    var ctx=null, muted=false;
    function ensure(){
      if(!ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;

    // 单个音：振荡器 + 增益包络（快速起音、指数衰减，避免爆音）
    function blip(opt){
      if(muted) return;
      var ac=ensure(); if(!ac) return;
      var t=ac.currentTime;
      var d=opt.d||0.1, v=opt.v==null?0.14:opt.v;
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=opt.type||"sine";

      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t+d);

    cur.c=g.c; cur.r=g.r; cur.n=g.c*g.r;
    var order=[]; for(var i=0;i<cur.n;i++) order.push(i);
    do{ shuffle(order); }while(isSolved(order));
    cur.slots=order; cur.moves=0; combo=0; cur.completed=false;   // 新关卡：连击清零
    $("hudLevel").textContent=lv;
    $("hudMoves").textContent=0;
    $("peekImg").src=cur.img;
    loadImage(cur.img);        // 按需加载当前关图片
    prefetchAhead(tid, lv);    // 空闲时后台预取下一页
    startTimer();
    buildBoard();
  }

  // ---------- 计时：仅计算页面可见且正在游戏的时段 ----------
  // 不用“当前时间 - 开局时间”，避免 Safari/Chrome 退到后台期间也被计入。
  function startTimer(){
    if(cur.timer) clearInterval(cur.timer);
    cur.elapsedMs=0;
    cur.runningSince=Date.now();
    cur.timerRunning=true;
    cur.timer=setInterval(updTime,1000);
    updTime();
  }
  function elapsedNow(){
    return cur.elapsedMs + (cur.timerRunning ? Date.now()-cur.runningSince : 0);
  }
  function pauseTimer(){
    if(!cur.timerRunning) return;
    cur.elapsedMs += Date.now()-cur.runningSince;
    cur.timerRunning=false;
    if(cur.timer){ clearInterval(cur.timer); cur.timer=null; }
    updTime();
  }
  function resumeTimer(){
    if(cur.timerRunning || cur.completed || !screens.game.classList.contains("active")) return;
    cur.runningSince=Date.now();
    cur.timerRunning=true;
    if(cur.timer) clearInterval(cur.timer);
    cur.timer=setInterval(updTime,1000);
    updTime();
  }
  function stopTimer(){ pauseTimer(); }
  function updTime(){
    var s=Math.floor(elapsedNow()/1000);
    var m=Math.floor(s/60); s=s%60;
    $("hudTime").textContent=m+":"+(s<10?"0":"")+s;
  }

  function buildBoard(){
    boardEl.style.gridTemplateColumns="repeat("+cur.c+",1fr)";
    boardEl.style.gridTemplateRows="repeat("+cur.r+",1fr)";
    render();
  }

  // 让棋盘按“图片真实比例”缩放并完整放入可用区域（碎片按比例裁切，非正方形）
  function fitBoard(){
    var wrap=boardEl.parentElement; // .boardwrap
    var wrapW=wrap.clientWidth, wrapH=wrap.clientHeight;
    if(wrapW===0||wrapH===0) return false;
    var d=IMG_DIMS[cur.img];
    var imgA = d ? (d.w/d.h) : (cur.c/cur.r);
    var bw=wrapW, bh=bw/imgA;
    if(bh>wrapH){ bh=wrapH; bw=bh*imgA; }
    boardEl.style.width=bw+"px";
    boardEl.style.height=bh+"px";
    return true;
  }

  // 按当前棋盘可用像素 + 图片比例，算出这台设备实际应玩的网格。
  // 入参 (mc,mr) 是 manifest 设定的“难度上限”；返回值在比例不变的前提下被设备屏幕封顶。
  function adaptiveGrid(mc, mr){
    var wrap=boardEl.parentElement; // .boardwrap
    var wrapW=wrap.clientWidth, wrapH=wrap.clientHeight;
    if(wrapW===0||wrapH===0) return {c:mc, r:mr};        // 量不到就先用上限
    var d=IMG_DIMS[cur.img];
    var imgA = d ? (d.w/d.h) : DEFAULT_IMG_ASPECT;       // 图片未载时用默认竖图比例
    // 棋盘实际像素（与 fitBoard 同逻辑：按比例完整放进可用区域）
    var bw=wrapW, bh=bw/imgA;
    if(bh>wrapH){ bh=wrapH; bw=bh*imgA; }
    var maxC=Math.max(MIN_GRID, Math.floor(bw/MIN_PIECE_W));
    var maxR=Math.max(MIN_GRID, Math.floor(bh/MIN_PIECE_H));
    // 宽、高独立封顶（不等比）：列不超过 maxC、行不超过 maxR。
    // 这样 iPhone 后期稳定封顶 ≈8×10，iPad/桌面则能跑满 manifest 设定的更大网格。
    var c=Math.min(mc, maxC);
    var r=Math.min(mr, maxR);
    return {c:c, r:r};
  }

  // ---------- 分组（合并）计算 ----------
  // 关键：合并基于「相对正确性」——只要两块在棋盘上彼此相邻、且在原图中本就
  // 是正确相邻的关系，就并入同一组（无论它们当前是否处于绝对正确位置）。
  // 组内无缝、组间留缝；这样你把两块拼对（哪怕整块还不在最终位置）就会自动焊成无缝整体。
  function joined(a,b){
    // a、b 为棋盘上正交相邻的格子；判断是否“在图里也正确相邻”。
    // 关键：方向由【棋盘网格坐标】决定，且水平合并必须校验【碎片内容】的行列边界。
    // 否则当“图片最右列碎片”与“下一行最左列碎片”在棋盘上水平相邻时，
    // 会因 slots 恰为 ±1 被误判为已拼对（它们在图里其实是一上一下）。
    var ra=rcOf(a), rb=rcOf(b);
    var sa=cur.slots[a], sb=cur.slots[b];
    var dr=rb.row-ra.row, dc=rb.col-ra.col;
    if(dr===0 && dc===1)  return (sa % cur.c !== cur.c-1) && (sb === sa+1); // 右邻：a 不能在图片最右列
    if(dr===0 && dc===-1) return (sa % cur.c !== 0)         && (sb === sa-1); // 左邻：a 不能在图片最左列
    if(dr===1 && dc===0)  return sb === sa + cur.c;                          // 下邻
    if(dr===-1 && dc===0) return sb === sa - cur.c;                          // 上邻
    return false;
  }
  function computeGroups(){
    var groupId=new Array(cur.n).fill(-1);
    var groups=[];
    for(var p=0;p<cur.n;p++){
      if(groupId[p]===-1){
        var id=groups.length, comp=[], stack=[p];
        groupId[p]=id;
        while(stack.length){
          var q=stack.pop(); comp.push(q);
          var rc=rcOf(q);
          var nb=[[rc.row-1,rc.col],[rc.row+1,rc.col],[rc.row,rc.col-1],[rc.row,rc.col+1]];
          for(var k=0;k<4;k++){
            var nr=nb[k][0], nc=nb[k][1];
            if(nr<0||nr>=cur.r||nc<0||nc>=cur.c) continue;
            var np=posOf(nr,nc);
            if(groupId[np]===-1 && joined(q,np)){ groupId[np]=id; stack.push(np); }
          }
        }
        groups.push(comp);
      }
    }
    cur.groups=groups;
    cur.groupId=groupId;
  }

  function render(){
    if(!fitBoard()) return;            // 同时按图片比例设置棋盘像素尺寸
    var boardW=boardEl.clientWidth, boardH=boardEl.clientHeight;
    if(boardW===0||boardH===0) return;
    cur.cellW=boardW/cur.c;
    cur.cellH=boardH/cur.r;
    computeGroups();

    boardEl.innerHTML="";
    for(var pos=0; pos<cur.n; pos++){
      var pieceId=cur.slots[pos];       // 该位置实际放置的碎片（其正确编号）
      var rc=rcOf(pieceId);             // 按碎片真实身份取对应图块切片
      var grc=rcOf(pos);                // 网格坐标，用于判断相邻缝隙
      var gid=cur.groupId[pos];
      // 四条边的缝隙：越界或与不同组相邻 -> 有缝（基于网格拓扑）
      var sTop = seamWith(grc.row-1,grc.col,gid);
      var sBot = seamWith(grc.row+1,grc.col,gid);
      var sLft = seamWith(grc.row,grc.col-1,gid);
      var sRgt = seamWith(grc.row,grc.col+1,gid);

      var piece=document.createElement("div");
      piece.className="piece";
      piece.dataset.pos=pos;

      // 图像层：永远按完整切片渲染（绝不裁剪），保证合并后严丝合缝、对齐
      var face=document.createElement("div");
      face.className="face";
      face.style.backgroundImage="url('"+cur.img+"')";
      face.style.backgroundSize=boardW+"px "+boardH+"px";
      face.style.backgroundPosition=(-rc.col*cur.cellW)+"px "+(-rc.row*cur.cellH)+"px";
      piece.appendChild(face);

      // 缝层：覆盖在图像之上的遮罩条；只在“有缝”的一侧画出 board 色条，合并时该侧不画 -> 无缝
      var seam=document.createElement("div");
      seam.className="seam";
      var sh=[];
      if(sTop) sh.push("inset 0 "+SEAM+"px 0 0 "+SEAM_COLOR);
      if(sBot) sh.push("inset 0 -"+SEAM+"px 0 0 "+SEAM_COLOR);
      if(sLft) sh.push("inset "+SEAM+"px 0 0 0 "+SEAM_COLOR);
      if(sRgt) sh.push("inset -"+SEAM+"px 0 0 0 "+SEAM_COLOR);
      if(sh.length) seam.style.boxShadow=sh.join(",");
      piece.appendChild(seam);

      attachDrag(piece);
      boardEl.appendChild(piece);
    }
  }
  function seamWith(nr,nc,gid){
    if(nr<0||nr>=cur.r||nc<0||nc>=cur.c) return true; // 棋盘边缘
    return cur.groupId[posOf(nr,nc)]!==gid;          // 不同组 -> 有缝
  }

  // ---------- 拖拽移动（整组一起） ----------
  var drag=null;
  function attachDrag(piece){
    piece.addEventListener("pointerdown",function(e){
      e.preventDefault();
      Sound.unlock();                // 首次手势内解锁音频（iOS 必须）
      var pos=parseInt(piece.dataset.pos,10);
      var grp=cur.groups[cur.groupId[pos]];
      grp.forEach(function(p){ boardEl.children[p].classList.add("lifting"); });
      drag={grp:grp, startX:e.clientX, startY:e.clientY, moved:false};
      window.addEventListener("pointermove",onMove);
      window.addEventListener("pointerup",onUp);
      Sound.pickup();               // 抓起：柔和“呜”
    });
  }
  function onMove(e){
    if(!drag) return;
    e.preventDefault();
    var dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) drag.moved=true;
    drag.grp.forEach(function(p){
      var el=boardEl.children[p];
      el.style.transform="translate("+dx+"px,"+dy+"px) scale(1.03)";
    });
  }
  function onUp(e){
    if(!drag) return;
    window.removeEventListener("pointermove",onMove);
    window.removeEventListener("pointerup",onUp);
    var dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    drag.grp.forEach(function(p){
      var el=boardEl.children[p];
      el.style.transform=""; el.classList.remove("lifting");
    });
    if(drag.moved){
      var dCol=Math.round(dx/cur.cellW), dRow=Math.round(dy/cur.cellH);
      var merged=tryMove(drag.grp, dCol, dRow);
      if(merged!==undefined){
        // 落位回弹：任何成功移动的组都轻轻“吸”一下
        drag.grp.forEach(function(p){
          var rc=rcOf(p), nr=rc.row+dRow, nc=rc.col+dCol;
          if(nr<0||nr>=cur.r||nc<0||nc>=cur.c) return;
          var el=boardEl.children[posOf(nr,nc)];
          if(el) el.classList.add("snap");
        });
      }
      if(merged===true){
        combo++;
        Sound.merge(combo);
        // 合并庆祝：粒子 + (≥2连击)徽章 + 震动，位置 = 移动后组的中心（换算到 boardwrap 坐标）
        var ox=boardEl.offsetLeft, oy=boardEl.offsetTop, cx=0, cy=0, cnt=0;
        drag.grp.forEach(function(p){
          var rc=rcOf(p), nr=rc.row+dRow, nc=rc.col+dCol;
          if(nr<0||nr>=cur.r||nc<0||nc>=cur.c) return;
          cx+=(nc+0.5)*cur.cellW; cy+=(nr+0.5)*cur.cellH; cnt++;
        });
        if(cnt>0){
          cx=ox+cx/cnt; cy=oy+cy/cnt;
          burst(cx,cy,combo>=3?16:10);
          if(combo>=2) comboBadge(cx,cy,combo);
        }
        buzz(15);
      }
      else if(merged===false){ combo=0; Sound.drop(); }   // 移动但无新合并：连击清零 + 松手“哒”
      // merged===undefined -> 越界放弃，归位，不发声、不清连击
    }else{
      Sound.drop();                        // 拎起又放下（没移动）：轻“哒”
    }
    drag=null;
  }
  // 统计当前“已拼对”的相邻边数（用于判断合并/打碎是否发生）
  function countJoined(){
    var cnt=0;
    for(var p=0;p<cur.n;p++){
      var rc=rcOf(p);
      if(rc.col<cur.c-1 && joined(p,p+1)) cnt++;
      if(rc.row<cur.r-1 && joined(p,p+cur.c)) cnt++;
    }
    return cnt;
  }
  // 整组平移换位：把组 G 整体平移 (dCol,dRow)，把落点处被占的碎片整体换到 G 腾出的位置。
  // 这是一个合法置换，并天然实现你想要的两种效果：
  //  · 拖到另一处 -> 整组与那里的一组碎片互换位置；
  //  · 拖到一个更大的合并块上 -> 那个大块被“打碎”（它的碎片被分散换走，合并解除）。
  function tryMove(grp, dCol, dRow){
    if(dCol===0 && dRow===0) return undefined;
    var A=grp.slice();
    var setA={}; A.forEach(function(p){ setA[p]=true; });
    // 计算整组平移后的目标格子 B，并校验不越界
    var B=[];
    for(var i=0;i<A.length;i++){
      var rc=rcOf(A[i]);
      var nr=rc.row+dRow, nc=rc.col+dCol;
      if(nr<0||nr>=cur.r||nc<0||nc>=cur.c) return undefined;   // 越界 -> 放弃本次移动，归位
      B.push(posOf(nr,nc));
    }
    var setB={}; B.forEach(function(p){ setB[p]=true; });
    var displaced = B.filter(function(p){ return !setA[p]; }); // 落点处被挤走的其他碎片
    var vacated  = A.filter(function(p){ return !setB[p]; });  // G 腾出、等待接收的格子
    if(displaced.length!==vacated.length) return undefined;    // 安全兜底
    var before=countJoined();
    var map={};
    for(var i=0;i<A.length;i++) map[A[i]]=B[i];                  // G 整体平移
    for(var i=0;i<displaced.length;i++) map[displaced[i]]=vacated[i]; // 被挤走的碎片填回腾出的格子
    var old=cur.slots.slice();
    var res=cur.slots.slice();
    for(var from in map){ res[map[from]]=old[from]; }
    cur.slots=res;
    cur.moves++;
    $("hudMoves").textContent=cur.moves;
    render();                       // 重算分组 -> 相邻正确的碎片自动合并/打碎
    var after=countJoined();
    if(isSolved(cur.slots)) win();
    return after>before;            // true=本次有新合并 -> 触发“叮”
  }

  // ---------- 提示 ----------
  function hint(){
    for(var pos=0; pos<cur.n; pos++){
      if(cur.slots[pos]!==pos){
        var targetPos=cur.slots.indexOf(pos);
        var pieces=boardEl.children;
        if(pieces[pos]) pieces[pos].classList.add("hint");
        if(pieces[targetPos]) pieces[targetPos].classList.add("hint");
        setTimeout(function(){
          var hs=document.querySelectorAll(".piece.hint");
          for(var i=0;i<hs.length;i++) hs[i].classList.remove("hint");
        },1100);
        break;
      }
    }
  }

  // ---------- 过关 ----------
  function starsFor(moves,n){
    if(moves<=n*1.5) return 3;
    if(moves<=n*2.5) return 2;
    return 1;
  }
  function win(){
    pauseTimer();
    cur.completed=true;
    var theme=curTheme(), total=theme.pages.length, page=theme.pages[cur.lv-1];
    var tp=themeProg(cur.tid);
    var st=starsFor(cur.moves,cur.n);
    var prev=tp.stars[cur.lv]||0;
    if(st>prev) tp.stars[cur.lv]=st;
    if(cur.lv+1>tp.unlocked) tp.unlocked=cur.lv+1;   // 通关最后一页也要把 unlocked 推进到 total+1，否则首页进度会少算最后一页
    saveProgress(progress);
    Sound.win();
    confetti();                            // 撒花
    buzz([40,60,40]);                      // 过关震动（两段）
    // 三颗星逐颗弹出（fx 关闭时直接亮，不播动画）
    var spans=$("winStars").children;
    for(var i=0;i<spans.length;i++){
      spans[i].className = i<st ? ("on"+(fxOn?" anim":"")) : "";
      spans[i].style.setProperty("--d",(0.25+i*0.22)+"s");
    }
    // 本页的一句话剧情
    $("winCaption").textContent = page.caption || "";
    $("winCaption").style.display = page.caption ? "" : "none";
    $("winInfo").textContent="步数 "+cur.moves+" · 用时 "+$("hudTime").textContent;
    var last = cur.lv>=total;
    $("winNext").style.display = last ? "none" : "";
    $("winNextFloat").style.display = last ? "none" : "";
    $("winOverlay").classList.remove("collapsed");
    $("winOverlay").classList.add("active");
  }

  // ---------- 首页：主题（剧情）列表 ----------
  function buildThemeList(){
    var g=$("themeList"); g.innerHTML="";
    THEMES.forEach(function(t){
      var tp=themeProg(t.id), total=t.pages.length;
      var done=Math.min(tp.unlocked-1, total); if(tp.unlocked>total) done=total;
      var card=document.createElement("div");
      card.className="tcard";
      card.innerHTML="<img class='cover' src='"+t.cover+"' alt='' loading='lazy'>"+
        "<div class='t-body'><div><div class='t-title'>"+t.title+"</div>"+
        "<div class='t-sub'>共 "+total+" 页"+(done>=total?" · 已完结 ✨":"")+"</div>"+
        "<div class='t-bar'><i style='width:"+Math.round(done/total*100)+"%'></i></div></div>"+
        "<div class='t-prog'><b>"+done+"</b>/"+total+"<div>阅读进度</div></div></div>";
      card.addEventListener("click",function(){ openChapter(t.id); });
      g.appendChild(card);
    });
  }

  // ---------- 章节地图（路径节点 = 每一页） ----------
  function openChapter(tid){
    cur.tid=tid;
    var theme=themeById(tid);
    $("chapterTitle").textContent=theme.title;
    var tp=themeProg(tid), total=theme.pages.length;
    var g=$("mapCol"); g.innerHTML="";
    for(var lv=1; lv<=total; lv++){
      (function(lv){
        var page=theme.pages[lv-1];
        var unlocked=lv<=tp.unlocked;
        var st=tp.stars[lv]||0;
        var node=document.createElement("div");
        var isCur=(lv===tp.unlocked && lv<=total && st===0);
        node.className="mapnode"+(unlocked?(st>0?" done":(isCur?" cur":"")):" locked");
        // 左侧 = 第几页（圆钮）；右侧 = 已通关页面的缩略图（未通关则不显示）；
        // 已通关时中间加一条虚线连接带，把圆钮和缩略图"缝"在一起
        var right="";
        if(st>0){
          right="<div class='mlink'></div>"+
                "<div class='mthumb'><img src='"+page.img+"' alt='' loading='lazy'>"+
                "<span class='mstars'>"+"★★★".substr(0,st)+"</span></div>";
        }
        node.innerHTML="<div class='mcircle'>"+(unlocked?lv:"🔒")+"</div>"+right;
        if(unlocked) node.addEventListener("click",function(){ startPage(tid,lv); });
        g.appendChild(node);
      })(lv);
    }
    show("chapter");
  }

  // ---------- 漫画阅读模式 ----------
  var readerTid=null;
  function openReader(tid, startIdx){
    readerTid=tid;
    var theme=themeById(tid), tp=themeProg(tid), total=theme.pages.length;
    $("readerTitle").textContent=theme.title;
    var track=$("readerTrack"); track.innerHTML="";
    for(var i=0;i<total;i++){
      (function(i){
        var page=theme.pages[i], unlocked=(i+1)<=tp.unlocked;
        var d=document.createElement("div");
        d.className="rpage";
        if(unlocked){
          var im=document.createElement("img");
          im.src=page.img; im.alt="第 "+(i+1)+" 页"; im.draggable=false;
          d.appendChild(im);
        }else{
          d.innerHTML="<div class='rlock'><span class='big'>🔒</span>这一页还未解锁<br>拼完第 "+(i+1)+" 页就能看到啦</div>";
        }
        d.dataset.idx=i;
        track.appendChild(d);
      })(i);
    }
    $("reader").classList.add("active");
    var idx=Math.max(0, Math.min(startIdx||0, total-1));
    requestAnimationFrame(function(){ track.scrollLeft=idx*track.clientWidth; updReaderCap(); });
  }
  function updReaderCap(){
    var track=$("readerTrack");
    var w=track.clientWidth||1;
    var i=Math.round(track.scrollLeft/w);
    var theme=themeById(readerTid), tp=themeProg(readerTid), total=theme.pages.length;
    if(i<0) i=0; if(i>total-1) i=total-1;
    var unlocked=(i+1)<=tp.unlocked;
    $("readerCapText").textContent = unlocked ? (theme.pages[i].caption||"") : "……";
    $("readerPageNum").textContent = "第 "+(i+1)+" 页 / 共 "+total+" 页";
  }
  function closeReader(){ $("reader").classList.remove("active"); }

  // ---------- 图片加载：按需加载当前关 + 空闲时后台预取下一关 ----------
  // 关键优化：不再启动时全量下载所有图片。只加载当前要玩的那张；
  // 玩的过程中用浏览器空闲时间（requestIdleCallback）预取下一关，做到“随开随玩”。
  var IMG_DIMS={};            // src -> {w,h} 真实尺寸（用于按比例裁切）
  var IMG_CACHE={};           // src -> true 已开始/完成加载，避免重复请求
  function loadImage(src, onDone){
    if(!src) return;
    if(IMG_DIMS[src]){ if(onDone) onDone(); return; }
    if(IMG_CACHE[src]) return;         // 已在加载中
    IMG_CACHE[src]=true;
    var im=new Image();
    im.onload=function(){
      IMG_DIMS[src]={w:im.naturalWidth,h:im.naturalHeight};
      if(onDone) onDone();
      // 若当前正在玩这一张，尺寸就绪后重排一次（按比例裁切）
      if(screens.game.classList.contains("active") && cur.img===src) render();
    };
    im.onerror=function(){ delete IMG_CACHE[src]; };  // 失败允许重试
    im.src=src;
  }
  // 浏览器空闲时预取本主题接下来 1-2 页的图片（不影响当前操作）
  function prefetchAhead(tid, lv){
    var run=function(){
      var pages=themeById(tid).pages;
      for(var k=1;k<=2;k++){ var L=pages[lv-1+k]; if(L) loadImage(L.img); }
    };
    if(window.requestIdleCallback) requestIdleCallback(run,{timeout:3000});
    else setTimeout(run,800);
  }

  // ---------- 事件绑定 ----------
  $("btnReset").addEventListener("click",function(){
    if(confirm("确定重置所有进度？")){ progress=defaultProg(); saveProgress(progress); buildThemeList(); alert("已重置"); }
  });
  $("chapterBack").addEventListener("click",function(){ buildThemeList(); show("home"); });
  $("gameBack").addEventListener("click",function(){ stopTimer(); openChapter(cur.tid); });
  $("btnReader").addEventListener("click",function(){
    var tp=themeProg(cur.tid);
    openReader(cur.tid, Math.max(0,Math.min(tp.unlocked, curTheme().pages.length)-1));
  });
  $("readerClose").addEventListener("click",closeReader);
  $("readerTrack").addEventListener("scroll",function(){
    clearTimeout(this._t); var self=this; this._t=setTimeout(updReaderCap,60);
  });
  $("btnSound").addEventListener("click",function(){
    var m=!Sound.isMuted();
    Sound.setMuted(m);
    this.classList.toggle("muted",m);
    this.title = m ? "音效：关" : "音效：开";
  });
  // 动效开关（粒子/撒花/震动/星级动画）
  var btnFx=$("btnFx");
  if(!fxOn) btnFx.classList.add("muted");
  btnFx.addEventListener("click",function(){
    fxOn=!fxOn; saveFx();
    this.classList.toggle("muted",!fxOn);
    this.title = fxOn ? "动效：开" : "动效：关";
  });
  $("btnRestart").addEventListener("click",function(){ startPage(cur.tid, cur.lv); });
  $("btnHint").addEventListener("click",hint);

  // 看原图：按住显示
  var peekEl=$("btnPeek"), peekOv=$("peekOverlay");
  function peekOn(e){ e.preventDefault(); peekOv.classList.add("active"); }
  function peekOff(){ peekOv.classList.remove("active"); }
  peekEl.addEventListener("pointerdown",peekOn);
  peekEl.addEventListener("pointerup",peekOff);
  peekEl.addEventListener("pointerleave",peekOff);
  peekOv.addEventListener("pointerup",peekOff);

  $("winReplay").addEventListener("click",function(){ $("winOverlay").classList.remove("active"); startPage(cur.tid, cur.lv); });
  $("winNext").addEventListener("click",function(){ $("winOverlay").classList.remove("active"); startPage(cur.tid, Math.min(cur.lv+1, curPages().length)); });
  $("winNextFloat").addEventListener("click",function(){ $("winOverlay").classList.remove("active"); startPage(cur.tid, Math.min(cur.lv+1, curPages().length)); });
  $("winSelect").addEventListener("click",function(){ $("winOverlay").classList.remove("active"); openChapter(cur.tid); });
  // 收起 sheet 进入「欣赏模式」；欣赏时点击图片区域再把 sheet 升回来
  $("winCollapse").addEventListener("click",function(){ $("winOverlay").classList.add("collapsed"); });
  $("winScrim").addEventListener("click",function(){ if($("winOverlay").classList.contains("collapsed")) $("winOverlay").classList.remove("collapsed"); });

  // ---------- 浏览器/系统生命周期：离开 Safari/Chrome 或切到后台时自动暂停计时 ----------
  // iOS Safari 通常触发 visibilitychange；Page Lifecycle 事件作为兼容兜底。
  function onPageVisibility(){
    if(document.hidden) pauseTimer();
    else resumeTimer();
  }
  document.addEventListener("visibilitychange",onPageVisibility);
  window.addEventListener("pagehide",pauseTimer);
  window.addEventListener("freeze",pauseTimer);
  window.addEventListener("pageshow",resumeTimer);

  // ---------- 游戏内拦截左缘右滑 ----------
  // Safari/Chrome 的系统级“边缘返回”无法由网页 100% 关闭；这里在拼图界面捕获手势，
  // 优先吃掉从最左 24px 向右的触摸移动，配合 CSS overscroll-behavior-x:none 避免中断游戏。
  var edgeSwipeStartX=null, edgeSwipeStartY=null;
  document.addEventListener("touchstart",function(e){
    if(!screens.game.classList.contains("active") || !e.touches || !e.touches.length) return;
    var t=e.touches[0];
    edgeSwipeStartX=t.clientX; edgeSwipeStartY=t.clientY;
  },{passive:true,capture:true});
  document.addEventListener("touchmove",function(e){
    if(edgeSwipeStartX===null || !e.touches || !e.touches.length) return;
    var t=e.touches[0], dx=t.clientX-edgeSwipeStartX, dy=t.clientY-edgeSwipeStartY;
    // 只吞最左缘向右的水平手势；棋盘其余位置的拖动完全不受影响。
    if(edgeSwipeStartX<=24 && dx>0 && Math.abs(dx)>=Math.abs(dy)) e.preventDefault();
  },{passive:false,capture:true});
  function clearEdgeSwipe(){ edgeSwipeStartX=null; edgeSwipeStartY=null; }
  document.addEventListener("touchend",clearEdgeSwipe,{passive:true,capture:true});
  document.addEventListener("touchcancel",clearEdgeSwipe,{passive:true,capture:true});

  // 屏幕尺寸变化时重新计算切片与缝隙
  var rzT;
  window.addEventListener("resize",function(){
    if(screens.game.classList.contains("active")){ clearTimeout(rzT); rzT=setTimeout(render,150); }
  });

  // 初始：不再全量预载图片。先读清单再渲染主题列表；图片在真正开始某一页时才按需下载。
  show("home");
  buildThemeList();
  loadManifest().then(function(){ if(screens.home.classList.contains("active")) buildThemeList(); });

  // 注册 Service Worker：缓存已访问的图片，二刷/重玩秒开、支持离线（渐进增强，失败不影响游戏）
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
